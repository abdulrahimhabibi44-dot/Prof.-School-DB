.pri-High{background:#ffe9cf;color:#b54708;border-color:#f6b872}

.tag.st-InProgress{background:#e4efff;color:#1f5fbf}
.tag.st-Completed{background:#e0f5e8;color:#1b7a46}

.pbar.ok i,.bar.ok i{background:var(--green)}.pbar.bad i,.bar.bad i{background:var(--red)}

.hhead{display:flex;gap:8px;align-items:center;margin-bottom:4px;font-size:12px}
.hnote{margin-top:5px;white-space:pre-wrap}
.pvbox{padding:8px 0}

const PRIORITIES=['Critical','High','Medium','Low'];
const PRI_RANK={Critical:0,High:1,Medium:2,Low:3};
let taskDept='all',taskPri='',taskStat='',repDept='all';
const num=x=>{const n=parseFloat(x);return isNaN(n)?0:n};
const fmt=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
const money=n=>fmt(n)+((db.settings&&db.settings.currency)?' '+db.settings.currency:'');
const dayDiff=(a,b)=>Math.round((new Date(a)-new Date(b))/86400000);
const byId=(type,id)=>(db[type]||[]).find(x=>x.id===id);
const isHttp=s=>/^https?:\/\//i.test(String(s||'').trim());

/* ---- migrate tasks saved by the earlier version of this file ---- */
function normalizeTasks(){
 const map={'Not started':'Not Started','In progress':'In Progress','Blocked':'In Progress','Under review':'In Progress','Completed':'Completed','Cancelled':'Not Started'};
 db.tasks.forEach(t=>{
  if(t.v===2)return;
  const old=t.status;
  t.status=map[old]||'Not Started';
  if(['Cancelled','Blocked','Under review'].includes(old))t.description=((t.description||'')+' [Previous status: '+old+']').trim();
  t.baseline=(t.baseline===undefined||t.baseline==='')?0:num(t.baseline);
  t.target=(t.target===undefined||t.target==='')?100:num(t.target);
  t.current=(t.current===undefined||t.current==='')?pct(t.progress):num(t.current);
  t.unit=t.unit||'%';t.budget=num(t.budget);t.spent=num(t.spent);
  t.updates=Array.isArray(t.updates)?t.updates:[];
  t.priority=PRIORITIES.includes(t.priority)?t.priority:'Medium';
  t.createdAt=t.createdAt||new Date().toISOString();
  if(t.evidence){t.updates.push({id:uid(),at:t.createdAt,date:today(),by:t.owner||'',prevValue:t.baseline,value:t.current,pct:taskPct(t),note:'Migrated from the earlier task record.',evidence:t.evidence});delete t.evidence}
  if(t.status==='Completed'&&!t.completedOn)t.completedOn=t.due||today();
  t.v=2;
 });
}

/* ---- calculations ---- */
function taskPct(t){const b=num(t.baseline),g=num(t.target),c=num(t.current);if(g===b)return c>=g?100:0;return Math.max(0,Math.min(100,Math.round((c-b)/(g-b)*100)))}
function effStatus(t){const p=taskPct(t);if(t.status==='Completed'||p>=100)return 'Completed';if(t.due&&t.due<today())return 'Overdue';if(t.status==='In Progress'||p>0)return 'In Progress';return 'Not Started'}
const taskSort=(a,b)=>((PRI_RANK[a.priority]??9)-(PRI_RANK[b.priority]??9))||((effStatus(a)==='Completed')-(effStatus(b)==='Completed'))||String(a.due||'9999').localeCompare(String(b.due||'9999'));
function summarize(list){
 const r={n:list.length,done:0,over:0,prog:0,ns:0,crit:0,budget:0,spent:0,sum:0};
 list.forEach(t=>{const s=effStatus(t);r.sum+=taskPct(t);r.budget+=num(t.budget);r.spent+=num(t.spent);
  if(s==='Completed')r.done++;else{if(s==='Overdue')r.over++;if(s==='In Progress')r.prog++;if(s==='Not Started')r.ns++;if(t.priority==='Critical')r.crit++}});
 r.avg=r.n?Math.round(r.sum/r.n):0;r.used=r.budget?Math.round(r.spent/r.budget*100):(r.spent?100:0);r.pending=r.prog+r.ns;return r}

/* ---- small UI helpers ---- */
const priTag=p=>`<span class="ptag pri-${esc(p)}">${esc(p)}</span>`;
const stTag=s=>`<span class="tag st-${esc(String(s).replace(' ',''))}">${esc(s)}</span>`;
function progCell(t){const p=taskPct(t),s=effStatus(t);const cls=s==='Completed'?'ok':s==='Overdue'?'bad':'';
 return `<div class="pbar ${cls}"><i style="width:${p}%"></i></div><div><b>${p}%</b> · ${fmt(t.current)}${t.unit?' '+esc(t.unit):''}</div><div class="small muted">Baseline ${fmt(t.baseline)} → Target ${fmt(t.target)}</div>`}
function budgetCell(t){const b=num(t.budget),s=num(t.spent),u=b>0?Math.round(s/b*100):(s>0?100:0),over=s>b;
 return `<div class="small">Required: <b>${money(b)}</b></div><div class="small">Spent: <b class="${over?'neg':''}">${money(s)}</b></div><div class="pbar ${over?'bad':''}"><i style="width:${Math.min(100,u)}%"></i></div><div class="small muted">${b>0||s>0?u+'% used':'No budget set'}</div>`}
function timeCell(t){const s=effStatus(t);let note='';
 if(s==='Completed')note=t.completedOn?'Completed '+esc(t.completedOn):'Completed';
 else if(t.due){const d=dayDiff(t.due,today());note=d<0?`<span class="neg">${-d} day(s) overdue</span>`:d===0?'Due today':`${d} day(s) left`}
 return `<div class="small">${esc(t.start||'—')} → <b>${esc(t.due||'—')}</b></div><div class="small muted">${note}</div>`}

  F('Strategic goal *',`<select name="goal" required>${ref('strategy',r.goal)}</select>`,1)+
  F('Priority *',`<select name="priority" required>${sel(PRIORITIES,r.priority)}</select>`)+
  F('Status',`<select name="status">${sel(['Not Started','In Progress','Completed'],r.status)}</select>`)+
  F('Start date',`<input type="date" name="start" value="${v('start')}">`)+
  F('Deadline *',`<input type="date" name="due" required value="${v('due')}">`)+
  F('Baseline (starting value) *',`<input type="number" step="any" name="baseline" required value="${v('baseline')}">`)+
  F('Target (final value) *',`<input type="number" step="any" name="target" required value="${v('target')}">`)+
  F('Unit of measure',`<input name="unit" placeholder="e.g. students, %, lessons" value="${v('unit')}">`)+
  F('Required budget'+((db.settings&&db.settings.currency)?' ('+esc(db.settings.currency)+')':''),`<input type="number" step="any" min="0" name="budget" value="${v('budget')}">`)+
  `<div class="notice full" style="margin:0">Current progress and actual spending are changed with <b>Update</b>, so every change is kept in the history. The status becomes <b>Overdue</b> automatically after the deadline passes.</div>`;
 document.getElementById('modalBg').classList.add('show');
}
function saveTask(f){
 const g=n=>(f.elements[n]?f.elements[n].value:'');
 const data={title:g('title').trim(),description:g('description').trim(),department:g('department'),owner:g('owner'),goal:g('goal'),priority:g('priority'),start:g('start'),due:g('due'),status:g('status')||'Not Started',unit:g('unit').trim(),baseline:num(g('baseline')),target:num(g('target')),budget:Math.max(0,num(g('budget')))};
 if(data.baseline===data.target){alert('The target must be different from the baseline.');return}
 if(data.start&&data.due&&data.due<data.start){alert('The deadline cannot be before the start date.');return}
 const backup=JSON.stringify(db.tasks);
 let t;
 if(editing.id){t=byId('tasks',editing.id);Object.assign(t,data)}
 else{t={id:uid(),v:2,current:data.baseline,spent:0,updates:[],createdAt:new Date().toISOString(),...data};db.tasks.push(t)}
 if(data.status==='Completed'){
  if(taskPct(t)<100){t.updates.push({id:uid(),at:new Date().toISOString(),date:today(),by:t.owner,prevValue:t.current,value:t.target,pct:100,prevSpent:t.spent,spent:t.spent,note:'Marked as completed in the task form.'});t.current=t.target}
  t.completedOn=t.completedOn||today();
 }else if(taskPct(t)>=100){t.status='Completed';t.completedOn=t.completedOn||today()}
 else t.completedOn='';
 if(save()){closeModal();render()}else{db.tasks=JSON.parse(backup)}
}

/* ---- Step 5: progress updates with history ---- */
function openUpdate(id){
 const t=byId('tasks',id);if(!t)return;
 const u=t.unit?' ('+esc(t.unit)+')':'';
 openPanel('Update progress — '+t.title,`<div class="notice success">Baseline <b>${fmt(t.baseline)}</b> → Target <b>${fmt(t.target)}</b>${u} · Current <b>${fmt(t.current)}</b> (${taskPct(t)}%)</div>
 <form onsubmit="submitUpdate(event,'${esc(t.id)}')"><div class="form-grid">
 <div class="field"><label>Updated by *</label><select name="by" required>${ownerOptions(t.department,t.owner)}</select></div>
 <div class="field"><label>Update date *</label><input type="date" name="date" value="${today()}" required></div>
 <div class="field"><label>New current value${u} *</label><input type="number" step="any" name="value" value="${esc(t.current)}" required oninput="previewPct('${esc(t.id)}',this.value)"></div>
 <div class="field"><label>Progress preview</label><div class="pvbox" id="pv"></div></div>
 <div class="field"><label>Actual spending to date${(db.settings&&db.settings.currency)?' ('+esc(db.settings.currency)+')':''}</label><input type="number" step="any" min="0" name="spent" value="${esc(t.spent)}"></div>
 <div class="field"><label>Evidence link or reference</label><input name="evidence" placeholder="https://… or document / report reference"></div>
 <div class="field full"><label>Progress note *</label><textarea name="note" required placeholder="What was done? Any challenges or next steps?"></textarea></div>
 <div class="field full"><label>Evidence file (optional, max 400 KB)</label><input type="file" name="file"></div>
 </div><div class="form-actions"><button type="button" class="light" onclick="closePanel()">Cancel</button><button class="primary" type="submit">Save update</button></div></form>`);
 previewPct(id,t.current);
}
function previewPct(id,v){const t=byId('tasks',id);if(!t)return;const p=taskPct({...t,current:num(v)});document.getElementById('pv').innerHTML=`<div class="pbar ${p>=100?'ok':''}"><i style="width:${p}%"></i></div><b>${p}%</b> <span class="small muted">of the way from baseline to target</span>`}
async function submitUpdate(e,id){
 e.preventDefault();const f=e.target,t=byId('tasks',id);if(!t)return;
 let file=null;const fl=f.elements.file.files[0];
 if(fl){
  if(fl.size>400*1024){alert('The evidence file is larger than 400 KB. Please attach a smaller file or paste a link instead.');return}
  file=await new Promise(res=>{const r=new FileReader();r.onload=()=>res({name:fl.name,type:fl.type,data:r.result});r.onerror=()=>res(null);r.readAsDataURL(fl)});
  if(!file){alert('The evidence file could not be read.');return}
 }
 const idx=db.tasks.findIndex(x=>x.id===id),backup=JSON.parse(JSON.stringify(t));
 const value=num(f.elements.value.value),spent=Math.max(0,num(f.elements.spent.value)),date=f.elements.date.value||today();
 const entry={id:uid(),at:new Date().toISOString(),date,by:f.elements.by.value,prevValue:t.current,value,prevSpent:t.spent,spent,note:f.elements.note.value.trim(),evidence:f.elements.evidence.value.trim()};
 if(file)entry.file=file;
 t.current=value;t.spent=spent;
 const p=taskPct(t);entry.pct=p;
 if(p>=100){t.status='Completed';t.completedOn=date}
 else{if(t.status==='Completed'){t.status='In Progress';t.completedOn=''}else if(t.status==='Not Started'&&value!==num(t.baseline))t.status='In Progress'}
 t.updates=(t.updates||[]).concat(entry);
 if(save()){closePanel();render();openHistory(id)}else db.tasks[idx]=backup;
}
function evidHtml(u){let h='';
 if(u.evidence)h+=isHttp(u.evidence)?`<div class="small">Evidence: <a href="${esc(String(u.evidence).trim())}" target="_blank" rel="noopener noreferrer">${esc(u.evidence)}</a></div>`:`<div class="small">Evidence: ${esc(u.evidence)}</div>`;
 if(u.file&&/^data:/i.test(u.file.data||''))h+=`<div class="small">Attached file: <a href="${esc(u.file.data)}" download="${esc(u.file.name)}">${esc(u.file.name)}</a></div>`;
 return h}
function openHistory(id){
 const t=byId('tasks',id);if(!t)return;
 const p=taskPct(t),s=effStatus(t),cls=s==='Completed'?'ok':s==='Overdue'?'bad':'';
 const D=(k,v)=>`<div class="dg"><span>${k}</span><b>${v}</b></div>`;
 const ups=(t.updates||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.at).localeCompare(String(a.at)));
 const b=num(t.budget),sp=num(t.spent);
 openPanel(t.title,`<div class="actions" style="margin-bottom:12px;align-items:center">${priTag(t.priority)} ${stTag(s)} <button class="primary" onclick="openUpdate('${esc(t.id)}')">＋ Add progress update</button> <button class="light" onclick="closePanel();openTaskForm('${esc(t.id)}')">Edit task</button></div>
 ${t.description?`<p class="small">${esc(t.description)}</p>`:''}
 <div class="pbar ${cls}" style="height:12px"><i style="width:${p}%"></i></div>
 <div class="small"><b>${p}%</b> complete · current ${fmt(t.current)}${t.unit?' '+esc(t.unit):''} (baseline ${fmt(t.baseline)} → target ${fmt(t.target)})</div>
 <div class="detail-grid">${D('Department',esc(label('departments',t.department)))}${D('Responsible',esc(label('people',t.owner)))}${D('Strategic goal',esc(label('strategy',t.goal)))}${D('Start date',esc(t.start||'—'))}${D('Deadline',esc(t.due||'—'))}${D('Completed on',esc(t.completedOn||'—'))}${D('Required budget',esc(money(b)))}${D('Actual spending',`<span class="${sp>b?'neg':''}">${esc(money(sp))}</span>`)}${D('Budget used',(b>0?Math.round(sp/b*100)+'%':'—'))}</div>
 <h4 style="margin:16px 0 4px;color:var(--navy)">Update history (${ups.length})</h4>
 ${ups.map(u=>`<div class="hitem"><div class="hhead"><b>${esc(u.date)}</b><span>by ${esc(label('people',u.by))}</span><span class="pill">${u.pct??''}%</span></div><div class="small">Value: ${fmt(u.prevValue)} → <b>${fmt(u.value)}</b>${(u.spent!==undefined&&u.prevSpent!==u.spent)?` · Spending: ${fmt(u.prevSpent)} → <b>${fmt(u.spent)}</b>`:''}</div>${u.note?`<div class="small hnote">${esc(u.note)}</div>`:''}${evidHtml(u)}</div>`).join('')||'<div class="empty">No progress updates recorded yet.</div>'}
 <div class="hitem created"><div class="small">Task created ${esc((t.createdAt||'').slice(0,10))} · baseline ${fmt(t.baseline)}, target ${fmt(t.target)}</div></div>`);
}

/* ---- Step 6: dashboard panel ---- */
function deptProgressPanel(){
 const all=summarize(db.tasks);
 const row=(name,s,click)=>`<tr class="${click?'clickrow':''}" ${click?`onclick="goTasks('${esc(click)}')"`:''}><td><b>${esc(name)}</b></td><td>${s.n}</td><td>${s.done}</td><td>${s.prog+s.ns}</td><td>${s.over?`<span class="neg">${s.over}</span>`:0}</td><td>${s.crit?`<span class="neg">${s.crit}</span>`:0}</td><td style="min-width:150px"><div class="pbar"><i style="width:${s.avg}%"></i></div><span class="small"><b>${s.avg}%</b></span></td><td>${s.used}%</td></tr>`;
 const orphan=db.tasks.filter(t=>!db.departments.some(d=>d.id===t.department));
 return `<section class="panel"><h3>Task progress — whole organization</h3>
 <div class="orgprog"><div class="big">${all.avg}%</div><div style="flex:1"><div class="pbar" style="height:12px"><i style="width:${all.avg}%"></i></div><div class="small muted">${all.done} of ${all.n} tasks completed · ${all.over} overdue · ${all.crit} critical open · budget used ${all.used}% (${esc(money(all.spent))} of ${esc(money(all.budget))})</div></div></div>
 <h3 style="margin-top:20px">Task progress by department</h3><div class="table-wrap"><table><thead><tr><th>Department</th><th>Tasks</th><th>Completed</th><th>Pending</th><th>Overdue</th><th>Critical open</th><th>Average progress</th><th>Budget used</th></tr></thead><tbody>
 ${db.departments.map(d=>row(d.name,summarize(db.tasks.filter(t=>t.department===d.id)),d.id)).join('')}${orphan.length?row('Unassigned / removed department',summarize(orphan)):''}
 <tr class="total"><td>Whole organization</td><td>${all.n}</td><td>${all.done}</td><td>${all.pending}</td><td>${all.over}</td><td>${all.crit}</td><td><b>${all.avg}%</b></td><td>${all.used}%</td></tr></tbody></table></div><p class="small muted">Click a department to open its task list.</p></section>`;
}

/* ---- Step 7: reports ---- */
function reportsPage(){
 if(repDept!=='all'&&!byId('departments',repDept))repDept='all';
 const list=db.tasks.filter(t=>repDept==='all'||t.department===repDept),s=summarize(list);
 const by=st=>list.filter(t=>effStatus(t)===st).sort(taskSort);
 const scope=repDept==='all'?'Whole organization':label('departments',repDept);
 const cPri=['Priority',t=>priTag(t.priority)],cTask=['Task',t=>`<b>${esc(t.title)}</b><div class="small muted">${esc(label('strategy',t.goal))}</div>`],cDept=['Department',t=>esc(label('departments',t.department))],cOwn=['Responsible',t=>esc(label('people',t.owner))],cDue=['Deadline',t=>esc(t.due||'—')],cProg=['Progress',t=>`<div class="pbar"><i style="width:${taskPct(t)}%"></i></div><b>${taskPct(t)}%</b>`],cStat=['Status',t=>stTag(effStatus(t))];
 const completed=by('Completed'),pending=list.filter(t=>['Not Started','In Progress'].includes(effStatus(t))).sort(taskSort),overdue=by('Overdue'),critical=list.filter(t=>t.priority==='Critical'&&effStatus(t)!=='Completed').sort(taskSort);
 let html=head('Task Reports','Completed, pending, overdue and critical tasks, plus budget usage — for one department or the whole organization.',`<button class="light" onclick="window.print()">🖨 Print</button> <button class="primary" onclick="exportTasksCsv()">⬇ Export CSV</button>`);
 html+=`<div class="toolbar"><span class="small muted">Report scope:</span><select class="search" style="min-width:260px" onchange="repDept=this.value;reportsPage()"><option value="all">Whole organization</option>${db.departments.map(d=>`<option value="${esc(d.id)}" ${repDept===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select><span class="small muted">Report date: ${today()} · Scope: ${esc(scope)}</span></div>`;
 html+=`<div class="stats s6">${statBox('Total tasks',s.n,'')}${statBox('Completed',s.done,s.n?Math.round(s.done/s.n*100)+'% of tasks':'')}${statBox('Pending',s.pending,'Not started or in progress')}${statBox('Overdue',`<span class="${s.over?'neg':''}">${s.over}</span>`,'Deadline passed')}${statBox('Critical (open)',`<span class="${s.crit?'neg':''}">${s.crit}</span>`,'')}${statBox('Budget used',s.used+'%',esc(money(s.spent))+' of '+esc(money(s.budget)))}</div>`;
 html+=budgetPanel(list);
 html+=repTable('Completed tasks',completed,[cPri,cTask,cDept,cOwn,cDue,['Completed on',t=>esc(t.completedOn||'—')],['Timing',t=>t.completedOn&&t.due?(t.completedOn<=t.due?'<span style="color:var(--green);font-weight:700">On time</span>':`<span class="neg">${dayDiff(t.completedOn,t.due)} day(s) late</span>`):'—'],['Budget / spent',t=>`${esc(money(t.budget))} / <span class="${num(t.spent)>num(t.budget)?'neg':''}">${esc(money(t.spent))}</span>`]],'No completed tasks yet.');
 html+=repTable('Pending tasks (not started or in progress)',pending,[cPri,cTask,cDept,cOwn,['Deadline',t=>{const d=dayDiff(t.due,today());return esc(t.due||'—')+(t.due?`<div class="small muted">${d===0?'Due today':d+' day(s) left'}</div>`:'')}],cProg,cStat],'No pending tasks.');
 html+=repTable('Overdue tasks',overdue,[cPri,cTask,cDept,cOwn,cDue,['Days overdue',t=>`<span class="neg">${dayDiff(today(),t.due)}</span>`],cProg],'No overdue tasks. 🎉');
 html+=repTable('Critical tasks (open)',critical,[cPri,cTask,cDept,cOwn,cDue,cProg,cStat],'No open critical tasks.');
 document.getElementById('main').innerHTML=html;
}
function repTable(title,list,cols,emptyMsg){
 return `<section class="panel"><h3>${title} <span class="pill">${list.length}</span></h3>${list.length?`<div class="table-wrap"><table style="min-width:900px"><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${list.map(t=>`<tr class="prow p-${esc(t.priority)}">${cols.map(c=>`<td>${c[1](t)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="empty">${emptyMsg}</div>`}</section>`}
function budgetPanel(list){
 const mk=(name,l)=>({name,n:l.length,b:l.reduce((a,t)=>a+num(t.budget),0),s:l.reduce((a,t)=>a+num(t.spent),0),over:l.filter(t=>num(t.spent)>num(t.budget)).length});
 const rows=repDept==='all'?db.departments.map(d=>mk(d.name,list.filter(t=>t.department===d.id))).filter(r=>r.n):list.slice().sort(taskSort).map(t=>mk(t.title,[t]));
 const tot=mk('Total',list);
 const tr=(r,cls)=>{const u=r.b?Math.round(r.s/r.b*100):(r.s?100:0),rem=r.b-r.s;return `<tr class="${cls||''}"><td><b>${esc(r.name)}</b></td><td>${esc(money(r.b))}</td><td>${esc(money(r.s))}</td><td class="${rem<0?'neg':''}">${esc(money(rem))}</td><td style="min-width:150px"><div class="pbar ${r.s>r.b?'bad':''}"><i style="width:${Math.min(100,u)}%"></i></div><span class="small">${u}% used</span></td><td>${r.over?`<span class="neg">${r.over}</span>`:'0'}</td></tr>`};
 return `<section class="panel"><h3>Budget usage</h3>${list.length?`<div class="table-wrap"><table style="min-width:760px"><thead><tr><th>${repDept==='all'?'Department':'Task'}</th><th>Required budget</th><th>Actual spending</th><th>Remaining</th><th>Usage</th><th>Over budget</th></tr></thead><tbody>${rows.map(r=>tr(r)).join('')}${tr(tot,'total')}</tbody></table></div>`:'<div class="empty">No tasks yet.</div>'}</section>`}
function exportTasksCsv(){
 const list=db.tasks.filter(t=>repDept==='all'||t.department===repDept).sort(taskSort);
 const head=['Department','Task','Description','Strategic goal','Responsible','Priority','Start date','Deadline','Baseline','Target','Unit','Current value','Progress %','Required budget','Actual spending','Status','Completed on','Updates'];
 const q=v=>{if(typeof v==='number')return String(v);let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
 const rows=list.map(t=>[label('departments',t.department),t.title,t.description,label('strategy',t.goal),label('people',t.owner),t.priority,t.start,t.due,num(t.baseline),num(t.target),t.unit,num(t.current),taskPct(t),num(t.budget),num(t.spent),effStatus(t),t.completedOn,(t.updates||[]).length]);
 const csv='\ufeff'+[head].concat(rows).map(r=>r.map(q).join(',')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='department-tasks-report-'+today()+'.csv';a.click();URL.revokeObjectURL(a.href);
}

/* ---- start-up ---- */
db.settings=db.settings||{currency:'USD'};
normalizeTasks();

render();
</script>
</body>
</html>
